services:
  # ============================================================================
  # 核心持久化存储 (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: resume_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resume_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 高速缓存与异步任务消息中介 (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: resume_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # FastAPI 后端服务 (应用容器)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_ai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Resume.AI Backend
      - APP_ENV=production
      - DEBUG=false
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/resume_ai
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
      - STORAGE_DIR=/app/storage
    volumes:
      - ./backend/storage:/app/storage

volumes:
  postgres_data:
  redis_data:
